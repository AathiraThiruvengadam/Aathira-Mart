<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aathira Mart - Checkout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f6;
        }

        .header {
            background: linear-gradient(135deg, #1b5e20, #43a047);
            color: white;
            padding: 22px 40px;
        }

        .header h1 {
            font-size: 28px;
        }

        .container {
            padding: 40px;
            max-width: 850px;
            margin: auto;
        }

        h2 {
            color: #222;
            margin-bottom: 25px;
        }

        .checkout-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .section {
            margin-bottom: 25px;
        }

        .section h3 {
            color: #2e7d32;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        .place-order {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .place-order:hover {
            background: #1b5e20;
        }

        .success {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .success h2 {
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .success p {
            font-size: 17px;
            margin-bottom: 20px;
        }

        .back-home {
            display: inline-block;
            padding: 12px 22px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🛒 AATHIRA MART</h1>
    </div>

    <div class="container">

        <h2>🧾 Checkout</h2>

        <div class="checkout-box">

            <!-- Checkout Form -->
            <form id="checkoutForm">

                <div class="section">
                    <h3>Customer Details</h3>

                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>

                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>

                    <label>Delivery Address</label>
                    <textarea id="address"
                              placeholder="Enter delivery address"
                              required></textarea>
                </div>

                <div class="section">
                    <h3>Payment Method</h3>

                    <select id="payment" required>
                        <option value="">Select Payment Method</option>
                        <option>Cash on Delivery</option>
                        <option>UPI</option>
                        <option>Debit / Credit Card</option>
                    </select>
                </div>

                <button type="submit" class="place-order">
                    Place Order 🛍️
                </button>

            </form>

            <!-- Success Message -->
            <div class="success" id="successMessage">

                <h2>✅ Order Placed Successfully!</h2>

                <p>
                    Thank you for shopping with Aathira Mart.
                </p>

                <a href="/dashboard" class="back-home">
                    Back to Dashboard
                </a>

            </div>

        </div>

    </div>

    <script>

        document.getElementById("checkoutForm").addEventListener("submit", function(event) {

            event.preventDefault();

            // Hide checkout form
            document.getElementById("checkoutForm").style.display = "none";

            // Show success message
            document.getElementById("successMessage").style.display = "block";

        });

    </script>

</body>
</html>
