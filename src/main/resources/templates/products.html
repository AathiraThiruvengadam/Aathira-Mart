<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aathira Mart - Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f6;
        }

        .header {
            background: linear-gradient(135deg, #1b5e20, #43a047);
            color: white;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
        }

        .header-links {
            display: flex;
            gap: 10px;
        }

        .header-links a {
            background: white;
            color: #2e7d32;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 35px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h2 {
            color: #222;
            margin-bottom: 8px;
        }

        .title p {
            color: #777;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            color: #222;
            margin-bottom: 8px;
        }

        .price {
            color: #2e7d32;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .cart-btn {
            display: block;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }

        .cart-btn:hover {
            background: #1b5e20;
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .products {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <h1>🛒 AATHIRA MART</h1>

        <div class="header-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/cart">🛒 Cart</a>
        </div>

    </div>

    <div class="container">

        <div class="title">
            <h2>Our Products 📦</h2>
            <p>Choose your favourite products and add them to your cart.</p>
        </div>

        <div class="products">

            <!-- Products from MySQL -->
            <div class="product" th:each="product : ${products}">

                <img th:src="${product.imageUrl}"
                     th:alt="${product.name}">

                <div class="product-info">

                    <h3 th:text="${product.name}">Product Name</h3>

                    <div class="price">
                        ₹<span th:text="${product.price}">0</span>
                    </div>

                    <a th:href="@{/cart(product=${product.name}, price=${product.price})}"
                       class="cart-btn">
                        Add to Cart 🛒
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
