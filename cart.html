<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aathira Mart - Cart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f6;
        }

        .header {
            background: linear-gradient(135deg, #1b5e20, #43a047);
            color: white;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
        }

        .back {
            background: white;
            color: #2e7d32;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 40px;
        }

        h2 {
            color: #222;
            margin-bottom: 25px;
        }

        .cart-box {
            max-width: 800px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .item-name {
            font-weight: bold;
            font-size: 18px;
        }

        .item-price {
            color: #2e7d32;
            font-weight: bold;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
        }

        .checkout {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 9px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .checkout:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🛒 AATHIRA MART</h1>

        <a href="/products" class="back">
            Products
        </a>
    </div>

    <div class="container">

        <h2>🛒 Your Cart</h2>

        <div class="cart-box">

            <div class="cart-item">
                <div class="item-name" id="productName">
                    Product
                </div>

                <div class="item-price" id="productPrice">
                    ₹0
                </div>
            </div>

            <div class="total">
                <span>Total</span>
                <span id="totalPrice">₹0</span>
            </div>

            <!-- Checkout -->
            <a href="/checkout" class="checkout">
                Proceed to Checkout
            </a>

        </div>

    </div>

    <script>

        // Get product details from URL
        const urlParams = new URLSearchParams(window.location.search);

        const product = urlParams.get("product");
        const price = urlParams.get("price");

        // Display selected product
        if (product && price) {

            document.getElementById("productName").textContent = product;

            document.getElementById("productPrice").textContent = "₹" + price;
